# Baut das Backend und führt alle Tests aus, bei jedem Push und jedem PR
name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = kompilieren, Tests, JaCoCo-Bericht und Coverage-Prüfung
      - name: Build und Tests
        run: ./mvnw -B verify

      # Auch bei roten Tests hochladen, damit der Bericht angesehen werden kann
      - name: JaCoCo-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Tatsächliche Coverage in der GitHub-Actions-Zusammenfassung anzeigen
      - name: Coverage in CI-Zusammenfassung anzeigen
        if: always()
        run: |
          echo "## JaCoCo Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kennzahl | Wert |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' '
              NR > 1 {
                missed += $4
                covered += $5
              }
              END {
                total = missed + covered
                if (total > 0) {
                  printf "| Instruction-Coverage | %.2f %% |\n", covered / total * 100
                } else {
                  print "| Instruction-Coverage | 0.00 % |"
                }
              }
            ' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Instruction-Coverage | nicht verfügbar |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "| Mindestabdeckung | 70 % |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Der vollständige HTML-Bericht wurde als Artifact hochgeladen." >> "$GITHUB_STEP_SUMMARY"
          echo "Lokaler Bericht: \`target/site/jacoco/index.html\`" >> "$GITHUB_STEP_SUMMARY"
