spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Fehlerantworten enthalten das Feld "message" (siehe Wiki: Einheitliches Fehlerformat)
server.error.include-message=always


# OpenAPI / Swagger (springdoc)
# Spezifikation: /v3/api-docs, Swagger-UI: /swagger-ui.html
# Fehlerantworten werden pro Endpunkt dokumentiert. Ohne diese Einstellung würde springdoc
# die Antworten aus dem ApiExceptionHandler an jeden Endpunkt hängen (auch an /api/health).
springdoc.override-with-generic-response=false
main
